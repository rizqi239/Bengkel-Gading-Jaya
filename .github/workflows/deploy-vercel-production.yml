name: Deploy Vercel production

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      confirm_production:
        description: Confirm that you want to deploy to production
        required: true
        type: choice
        options:
          - cancel
          - deploy
        default: cancel

permissions:
  contents: read

concurrency:
  group: vercel-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.confirm_production == 'deploy') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[deploy-production]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Verify Vercel token is configured
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN || secrets.BENGKEL_GADING_JAYA || secrets.GADING_JAYA }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "Add VERCEL_TOKEN as a GitHub Actions repository secret before deploying."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install --global vercel@65.2.0

      - name: Authenticate with Vercel
        id: vercel-auth
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          BENGKEL_GADING_JAYA_TOKEN: ${{ secrets.BENGKEL_GADING_JAYA }}
          GADING_JAYA_TOKEN: ${{ secrets.GADING_JAYA }}
        run: |
          if [ -n "$VERCEL_TOKEN" ] && vercel whoami --format json >/dev/null 2>&1; then
            echo "token_secret=VERCEL_TOKEN" >> "$GITHUB_OUTPUT"
            echo "Vercel authentication succeeded using VERCEL_TOKEN."
          elif [ -n "$BENGKEL_GADING_JAYA_TOKEN" ] && VERCEL_TOKEN="$BENGKEL_GADING_JAYA_TOKEN" vercel whoami --format json >/dev/null 2>&1; then
            echo "token_secret=BENGKEL_GADING_JAYA" >> "$GITHUB_OUTPUT"
            echo "Vercel authentication succeeded using BENGKEL_GADING_JAYA."
          elif [ -n "$GADING_JAYA_TOKEN" ] && VERCEL_TOKEN="$GADING_JAYA_TOKEN" vercel whoami --format json >/dev/null 2>&1; then
            echo "token_secret=GADING_JAYA" >> "$GITHUB_OUTPUT"
            echo "Vercel authentication succeeded using GADING_JAYA."
          else
            echo "Vercel authentication failed. Update VERCEL_TOKEN or GADING_JAYA with a valid token for the account that owns this project."
            exit 1
          fi

      - name: Link the production Vercel project
        env:
          VERCEL_TOKEN: ${{ steps.vercel-auth.outputs.token_secret == 'VERCEL_TOKEN' && secrets.VERCEL_TOKEN || steps.vercel-auth.outputs.token_secret == 'BENGKEL_GADING_JAYA' && secrets.BENGKEL_GADING_JAYA || secrets.GADING_JAYA }}
        run: vercel link --yes --team team_GfJYKPTrNp7DJjpjGArfencc --project prj_uGtI05jocA3IsqbDjvKeuslpD4Hj

      - name: Build, patch PHP runtime, and deploy
        env:
          VERCEL_TOKEN: ${{ steps.vercel-auth.outputs.token_secret == 'VERCEL_TOKEN' && secrets.VERCEL_TOKEN || steps.vercel-auth.outputs.token_secret == 'BENGKEL_GADING_JAYA' && secrets.BENGKEL_GADING_JAYA || secrets.GADING_JAYA }}
        run: npm run deploy:production