name: Deploy Vercel production

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      confirm_production:
        description: Confirm that you want to deploy to production
        required: true
        type: choice
        options:
          - cancel
          - deploy
        default: cancel

permissions:
  contents: read

concurrency:
  group: vercel-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.confirm_production == 'deploy') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[deploy-production]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Validate production branch and confirmation
        env:
          WORKFLOW_REF: ${{ github.ref }}
          EVENT_NAME: ${{ github.event_name }}
          CONFIRM_PRODUCTION: ${{ inputs.confirm_production }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          if [ "$WORKFLOW_REF" != "refs/heads/main" ]; then
            echo "Production deployments must be run from the main branch."
            exit 1
          fi
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$CONFIRM_PRODUCTION" != "deploy" ]; then
            echo "Production deployment was not explicitly confirmed."
            exit 1
          fi
          if [ "$EVENT_NAME" = "push" ] && ! echo "$COMMIT_MSG" | grep -q "\[deploy-production\]"; then
            echo "Push does not contain [deploy-production]."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify Vercel token is configured
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_VAR: ${{ vars.VERCEL_TOKEN }}
          BENGKEL_GADING_JAYA_TOKEN: ${{ secrets.BENGKEL_GADING_JAYA }}
          GADING_JAYA_TOKEN: ${{ secrets.GADING_JAYA }}
        run: |
          TOKEN="${VERCEL_TOKEN:-${VERCEL_VAR:-${BENGKEL_GADING_JAYA_TOKEN:-$GADING_JAYA_TOKEN}}}"
          if [ -z "$TOKEN" ]; then
            echo "No token found in secrets.VERCEL_TOKEN, vars.VERCEL_TOKEN, secrets.BENGKEL_GADING_JAYA, or secrets.GADING_JAYA."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install --global vercel@65.2.0

      - name: Authenticate with Vercel
        id: vercel-auth
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_VAR: ${{ vars.VERCEL_TOKEN }}
          BENGKEL_GADING_JAYA_TOKEN: ${{ secrets.BENGKEL_GADING_JAYA }}
          GADING_JAYA_TOKEN: ${{ secrets.GADING_JAYA }}
        run: |
          for name in VERCEL_TOKEN VERCEL_VAR BENGKEL_GADING_JAYA GADING_JAYA; do
            case "$name" in
              VERCEL_TOKEN) val="$VERCEL_TOKEN" ;;
              VERCEL_VAR) val="$VERCEL_VAR" ;;
              BENGKEL_GADING_JAYA) val="$BENGKEL_GADING_JAYA_TOKEN" ;;
              GADING_JAYA) val="$GADING_JAYA_TOKEN" ;;
            esac
            val=$(echo "$val" | tr -d '\r\n[:space:]')
            if [ -n "$val" ]; then
              echo "Testing authentication with $name..."
              if VERCEL_TOKEN="$val" vercel whoami; then
                echo "token_secret=$name" >> "$GITHUB_OUTPUT"
                echo "token_val=$val" >> "$GITHUB_OUTPUT"
                echo "Vercel authentication succeeded using $name."
                exit 0
              fi
            fi
          done
          echo "Vercel authentication failed. Update VERCEL_TOKEN with a valid token for the account that owns this project."
          exit 1

      - name: Link the production Vercel project
        env:
          VERCEL_TOKEN: ${{ steps.vercel-auth.outputs.token_val }}
        run: vercel link --yes --team team_GfJYKPTrNp7DJjpjGArfencc --project prj_uGtI05jocA3IsqbDjvKeuslpD4Hj

      - name: Build, patch PHP runtime, and deploy
        env:
          VERCEL_TOKEN: ${{ steps.vercel-auth.outputs.token_val }}
          CONFIRM_PRODUCTION_DEPLOY: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm_production || 'deploy' }}
        run: npm run deploy:production